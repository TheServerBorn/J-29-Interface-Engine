; J-29 Emulator Profiles — v0.25
; Copy/rename to emulators.ini (J-29 creates it automatically if missing).
;
; A game with launch_type=ROM can specify emulator=<profile ID>.
; If emulator is blank, J-29 can match the game's platform to platforms=.
;
; executable_* may be a full path or a command available on PATH.
; arguments supports {rom}. Keep {rom} quoted for paths containing spaces.

[RETROARCH]
name=RetroArch
platforms=SNES,NES,GENESIS,GBA
executable_windows=retroarch.exe
executable_linux=retroarch
executable_macos=/Applications/RetroArch.app/Contents/MacOS/RetroArch
arguments="{rom}"

[DOLPHIN]
name=Dolphin
platforms=GAMECUBE,WII
executable_windows=Dolphin.exe
executable_linux=dolphin-emu
executable_macos=/Applications/Dolphin.app/Contents/MacOS/Dolphin
arguments="-e" "{rom}"

[PCSX2]
name=PCSX2
platforms=PS2
executable_windows=pcsx2-qt.exe
executable_linux=pcsx2-qt
executable_macos=/Applications/PCSX2.app/Contents/MacOS/pcsx2-qt
arguments="{rom}"

[PPSSPP]
name=PPSSPP
platforms=PSP
executable_windows=PPSSPPWindows64.exe
executable_linux=PPSSPPSDL
executable_macos=/Applications/PPSSPP.app/Contents/MacOS/PPSSPP
arguments="{rom}"
