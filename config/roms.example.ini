; J-29 automatic ROM discovery
;
; Add one section per ROM collection. Folder names beneath each root are used
; to determine the platform. Examples: SNES, NES, GBA, Sega Genesis,
; Nintendo 64, Playstation 1, Dreamcast, MAME.
;
; Windows example:
; path=D:\Roms
;
; Linux/macOS example:
; path=~/Games/ROMs

[ROM_LIBRARY_1]
path=
enabled=true
scan_subfolders=true
