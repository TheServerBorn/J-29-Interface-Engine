# J-29 v0.27 physical media descriptor examples.
# Use one [J29_MEDIA] descriptor per physical medium.

# ------------------------------------------------------------
# SINGLE-GAME LAUNCH KEY
# ------------------------------------------------------------
# [J29_MEDIA]
# type=GAME
# title=MOONSTONE ISLAND
# platform=PC
# game_id=STEAM_1658150

# ------------------------------------------------------------
# SINGLE-GAME SELF-CONTAINED ROM
# ------------------------------------------------------------
# [J29_MEDIA]
# type=GAME
# title=HARVEST MOON
# platform=SNES
# rom=SNES\Harvest Moon (USA).zip

# ------------------------------------------------------------
# COLLECTION
# Collection items may be launch keys, self-contained ROMs, or a mix.
# game_id takes precedence if both game_id and rom are present.
# ------------------------------------------------------------
[J29_MEDIA]
type=COLLECTION
title=J-29 FAVORITES

[ITEM_1]
title=HARVEST MOON
platform=SNES
game_id=ROM_SNES_6009C68D2439

[ITEM_2]
title=MOONSTONE ISLAND
platform=PC
game_id=STEAM_1658150

# Self-contained collection item example:
# [ITEM_3]
# title=DOOM
# platform=SNES
# rom=SNES\Doom (USA).zip
