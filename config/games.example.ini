; J-29 Game Library Example
; folder= controls the virtual directory shown under GAMES/
;
; v0.21 metadata fields:
; title=            Optional display title override. Defaults to name.
; platform=         Platform/system name. Defaults to folder.
; year=             Release year.
; genre=            Free-form genre text.
; developer=        Developer/studio.
; publisher=        Publisher.
; launch_type=      EXECUTABLE, ROM, or STEAM (future launchers may add more).
; path=             Legacy executable path; still supported.
; executable_path=  Explicit executable path.
; rom_path=         ROM/disc-image path.
; emulator=         Emulator/profile identifier.
; steam_id=         Steam App ID.
; favorite=         true/false. Stored now for future Favorites support.

[GAME1]
name=NOTEPAD
path=notepad.exe
folder=WINDOWS
platform=WINDOWS
launch_type=EXECUTABLE
genre=UTILITY

[GAME2]
name=CALCULATOR
path=calc.exe
folder=WINDOWS
platform=WINDOWS
launch_type=EXECUTABLE
genre=UTILITY

[GAME3]
name=DOOM
folder=DOS
platform=DOS
year=1993
genre=FIRST-PERSON SHOOTER
developer=id Software
publisher=id Software
launch_type=EXECUTABLE
executable_path=

[GAME4]
name=SUPER MARIO WORLD
folder=SNES
platform=SNES
year=1990
genre=PLATFORMER
developer=Nintendo EAD
publisher=Nintendo
launch_type=ROM
rom_path=
emulator=RETROARCH
favorite=false

; Optional manual Steam entry. Installed Steam games are also discovered
; automatically in v0.24. A manual entry with the same steam_id overrides
; the auto-discovered record so richer metadata can be supplied.
[STEAM_EXAMPLE]
name=EXAMPLE STEAM GAME
folder=STEAM
platform=PC
launch_type=STEAM
steam_id=123456
; year=
; genre=
; developer=
; publisher=


; v0.25 also supports platform-based emulator matching.
; If emulator= is omitted, J-29 searches emulator profiles whose platforms=
; contains the game's platform.
[PS2_EXAMPLE]
name=EXAMPLE PS2 GAME
folder=PS2
platform=PS2
launch_type=ROM
rom_path=
; emulator=PCSX2
