[THEME]
name=Amber Terminal

[COLORS]
background=#000000
primary=#FFB000
secondary=#3A2500

[FONT]
family=Courier New
title_size=24
menu_size=20
status_size=18
cursor_size=20

[CRT]
scanlines=true
scanline_spacing=6
scanline_intensity=40

[CURSOR]
style=UNDERSCORE

[AUDIO]
boot=sounds/boot.wav
menu_move=sounds/menu_move.wav
select=sounds/select.wav
error=sounds/error.wav
media_detected=sounds/media_detected.wav
access_granted=sounds/access_granted.wav
access_denied=sounds/access_denied.wav
launch=sounds/launch.wav
shutdown=sounds/shutdown.wav
